<!DOCTYPE html>
<html>
<head>
    <title>Vehicle Detection</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: monospace;
            gap: 16px;
            padding: 20px;
        }
        h1 { color: #0f0; font-size: 1.5em; }
        #status {
            font-size: 1.1em;
            padding: 8px 24px;
            border-radius: 20px;
            transition: all 0.3s;
        }
        .car    { background: #ff000033; color: #ff4444; border: 1px solid #ff4444; }
        .no-car { background: #00ff0022; color: #00ff00; border: 1px solid #00ff00; }
        #feed {
            max-width: 90%;
            border: 2px solid #0f0;
            border-radius: 8px;
        }
        #log {
            width: 90%;
            max-width: 640px;
            height: 150px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            overflow-y: auto;
            padding: 8px;
            color: #aaa;
            font-size: 0.8em;
        }
        .log-car  { color: #ff4444; }
        .log-info { color: #aaa; }
    </style>
</head>
<body>
    <h1>Vehicle Detection</h1>
    <div id="status" class="no-car">⬤ &nbsp;A aguardar...</div>
    <img id="feed" src="/stream" />
    <div id="log"></div>

    <script>
        function addLog(msg, cls) {
            const log = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            const line = document.createElement('div');
            line.className = cls;
            line.textContent = `[${time}] ${msg}`;
            log.prepend(line);
            // Limita a 50 linhas
            while (log.children.length > 50) log.removeChild(log.lastChild);
        }

        let lastCar = false;

        setInterval(() => {
            fetch('/status')
                .then(r => r.json())
                .then(data => {
                    const el = document.getElementById('status');
                    if (data.car) {
                        el.className = 'car';
                        el.textContent = '⬤  CAR DETECTED';
                        if (!lastCar) addLog(' CAR DETECTED!', 'log-car');
                    } else {
                        el.className = 'no-car';
                        el.textContent = '⬤  No car detected';
                        if (lastCar) addLog('No car detected', 'log-info');
                    }
                    lastCar = data.car;
                })
                .catch(() => {});
        }, 500);
    </script>
</body>
</html>
